name: Update plugin catalog
on:
  push:
    branches: [main]
    paths:
      - 'plugins/system/**'
      - 'plugins/app/**'
      - 'scripts/generate_catalog.py'
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/generate_catalog.py'
  workflow_dispatch:
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and regenerate catalog
        run: python scripts/generate_catalog.py
      - name: Commit refreshed catalog to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- plugins/index.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add plugins/index.json
            git commit -m 'chore(plugins): refresh plugin catalog'
            git push
          fi
